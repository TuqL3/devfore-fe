# The devforge-web image: the built SPA and nothing else.
#
# Mounted into /etc/nginx/conf.d/, which the stock image includes from inside
# http{}. This container sits behind the edge (devforge-be's
# deploy/nginx/devforge.conf) and is never reached from outside, so there is no
# TLS here, no real-ip handling and no routing — the edge already decided this
# request is not /api, /ws or /uploads.
server {
    listen 80;
    root /usr/share/nginx/html;

    # nginx gzips text/html and nothing else by default, and the bundle is the
    # whole payload: ~1.1 MB raw against ~300 KB gzipped. Cloudflare compresses
    # at its own edge too, but this hop is origin → edge and it is not free.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames, so the content behind a given URL never changes. A year
    # is the maximum the spec allows and immutable stops browsers revalidating
    # on reload.
    #
    # This is a longer prefix than `location /`, so it wins for /assets/* and a
    # missing asset 404s here rather than falling through to index.html —
    # which is right: HTML served as JavaScript fails in a much stranger way.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The opposite: this file's name never changes but its contents do on every
    # deploy, and it is the one that names the hashed bundles. Cached, it pins
    # a browser to the previous release's assets.
    #
    # try_files below reaches it by internal redirect, which re-enters location
    # matching, so a client-side route gets this header too.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: /labs/42 is not a file, and the SPA resolves it once
    # index.html has loaded and React Router has run.
    location / {
        try_files $uri /index.html;
    }
}
