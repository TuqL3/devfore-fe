# SonarQube Cloud. Paired with devforge-be's file; same reasoning, two projects
# because they are two repositories and two quality gates.
#
# ⚠️ Guesses until someone creates the project — check both against the UI on
# the first run. See devforge-be's copy for why.
sonar.projectKey=TuqL3_devfore-fe
sonar.organization=tuql3

sonar.sources=src
sonar.tests=src
# The eight assert files. They are tests in every sense except the framework:
# `npm run check` runs them and CI fails if one throws.
sonar.test.inclusions=src/**/*.check.ts

# dist/ is build output and public/ is static assets copied verbatim.
sonar.exclusions=dist/**,public/**

# No coverage is reported, and that is not an oversight to paper over: this repo
# has no coverage instrumentation. `npm run check` runs eight node assert files
# and reports pass or fail, not lines hit. Pointing
# sonar.javascript.lcov.reportPaths at a file that does not exist would make
# the dashboard say 0.0% and look like a regression from nothing.
#
# The gate below therefore judges issues, duplication and new-code smells here,
# not coverage. If that becomes the thing worth measuring, the honest move is
# to add a test runner first.

sonar.qualitygate.wait=true
