name: CI

on:
  push:
    # develop integrates and deploys to the dev box; master is what releases
    # are cut from. The difference is in the `if:` guards, not in this block:
    #
    #   push develop → check → build + scan → dev-<sha> + :develop → dev box
    #   push master  → check only
    #   push tag v*  → check → promote dev-<sha> to :v* (no build)
    #
    # Watching `main` meant every merge landed without CI ever running, and
    # only the pull_request trigger was doing any work. Neither branch is main.
    branches: [master, develop]
    # A release tags this repo too. Production is deployed from devforge-be, but
    # the tag is what promotes this repo's image to the version number
    # devforge-be's deploy job waits for.
    tags: ["v*"]
  pull_request:

env:
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/devforge-web

jobs:
  fe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # The eight assert files under src/lib and src/sims. Without this line a
      # broken simulation engine keeps the build green.
      - run: npm run check
      - run: npm run build

  # Code quality, alongside oxlint and tsc. Self-skips without SONAR_TOKEN, the
  # same way the deploy jobs skip without their SSH secrets: the
  # project does not exist on SonarQube Cloud yet, and a job that is red on
  # every branch until someone signs up teaches people to stop reading CI.
  #
  # No artifact to collect, unlike devforge-be: there is no coverage report in
  # this repo to hand over. sonar-project.properties says why.
  sonar:
    needs: [fe]
    runs-on: ubuntu-latest
    steps:
      - id: gate
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "no SONAR_TOKEN — SonarQube Cloud project not set up yet, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          # Sonar reads git history to decide what counts as new code, and the
          # gate judges the diff. A shallow clone makes every line look new.
          fetch-depth: 0
      # No SONAR_HOST_URL: that variable is for a self-hosted server and setting
      # it points the scanner away from Cloud. sonar.qualitygate.wait in
      # sonar-project.properties is what fails this job on a red gate.
      - uses: SonarSource/sonarqube-scan-action@v8.2.2
        if: steps.gate.outputs.skip != 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  secrets:
    runs-on: ubuntu-latest
    # gitleaks lists the commits on the pull request to decide what to scan, and
    # the default token cannot read them: the API answers 403 and the job dies
    # before it looks at a single line.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # package-lock.json, mostly. A vulnerable transitive dependency is both
      # more common and more directly ours than anything in the runtime base.
      #
      # --ignore-unfixed is not optional: without it CI goes red over CVEs with
      # no patch to apply, and three weeks later somebody deletes the job.
      - name: trivy fs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # The only build. Every push to develop builds the image ONCE, scans it, and
  # pushes it as dev-<full sha> (never moves; what a release promotes) and
  # :develop (moves; what the dev box deploys). The revision label is how the
  # dev box records which commit it serves, and that record is what
  # devforge-be's scripts/release.sh tags.
  #
  # The image is environment-free: the Dockerfile pins VITE_API_URL to the empty
  # string, so the bundle calls relative paths and one image serves dev and
  # production. That is the only reason a frontend image can be promoted at all
  # rather than rebuilt per environment.
  image-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [fe, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: name the image
        run: |
          {
            echo "WEB_IMAGE=${WEB_IMAGE,,}"
            echo "TAG=dev-$GITHUB_SHA"
          } >> "$GITHUB_ENV"
      # --load, not --push: Trivy has to read the image locally, and nothing
      # reaches the registry until it has been scanned. A scan after the push is
      # a report, not a gate.
      - name: build
        run: |
          docker build --target prod --load \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$WEB_IMAGE:$TAG" .
      - name: trivy image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.WEB_IMAGE }}:${{ env.TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: push
        run: |
          set -euo pipefail
          docker tag "$WEB_IMAGE:$TAG" "$WEB_IMAGE:develop"
          docker push --quiet "$WEB_IMAGE:$TAG"
          docker push --quiet "$WEB_IMAGE:develop"

  # Dev only. Production is still deployed from devforge-be and nowhere else:
  # a release must wait for both repos' images, and only that repo's deploy job
  # does. Dev has no such gate — each push ships what it changed — so this repo
  # deploys there too, on its own pushes.
  #
  # Both repos deploy to the same box and a `concurrency` group cannot span
  # repositories, so the box serialises them: DEPLOY_WAIT makes devforge-be's
  # up.sh queue on its flock instead of refusing.
  deploy-dev:
    needs: [image-dev]
    runs-on: ubuntu-latest
    # SSH_HOST / SSH_USER / SSH_KEY for the dev box, as environment secrets.
    # This repo holds no production secret at all.
    environment: development
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - id: gate
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "no SSH_HOST in the development environment — dev box not provisioned yet, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: ssh and deploy
        if: steps.gate.outputs.skip != 'true'
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          # The be clone follows origin/develop here: this push changed only
          # the frontend, and the backend on dev should be develop's newest.
          timeout 1800 ssh -o ConnectTimeout=10 -o BatchMode=yes \
            -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -e
             cd /opt/devforge/devforge-be
             git fetch --force origin
             git checkout --force --detach origin/develop
             IMAGE_TAG=develop DEPLOY_WAIT=900 ./deploy/up.sh"

  # A release builds nothing. devforge-be's scripts/release.sh tagged the commit
  # the dev box was serving, and its image already exists as dev-<sha>: built
  # once, scanned, run on dev. This re-scans it (CVEs published since then
  # count) and gives the same image the version name devforge-be's deploy job
  # is waiting for.
  promote:
    if: github.ref_type == 'tag'
    needs: [fe, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # `tags: ["v*"]` filters names, not shell metacharacters, and this
          # value becomes a docker tag. Same rule as devforge-be's release-guard.sh.
          case "$TAG" in
            v[0-9]*) [ -z "${TAG//[A-Za-z0-9._-]/}" ] || { echo "refusing tag: $TAG"; exit 1; } ;;
            *) echo "refusing tag: $TAG"; exit 1 ;;
          esac
          # A tag on a commit that never reached master was never reviewed.
          git fetch origin master
          git merge-base --is-ancestor HEAD origin/master \
            || { echo "tag $TAG is not on master"; exit 1; }
          {
            echo "WEB_IMAGE=${WEB_IMAGE,,}"
            echo "TAG=$TAG"
            echo "SRC=dev-$GITHUB_SHA"
          } >> "$GITHUB_ENV"
      - name: pull what dev ran
        run: |
          docker pull --quiet "$WEB_IMAGE:$SRC" || {
            echo "$WEB_IMAGE:$SRC does not exist — this commit was never built on develop, so it never ran on dev" >&2
            exit 1
          }
      - name: trivy image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.WEB_IMAGE }}:${{ env.SRC }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # A re-tag of a pulled image: the layers are already in the registry, so
      # the push uploads only the new name. The digest is printed so the log
      # shows the version and dev-<sha> are the same image.
      - name: promote
        run: |
          set -euo pipefail
          docker tag "$WEB_IMAGE:$SRC" "$WEB_IMAGE:$TAG"
          docker push --quiet "$WEB_IMAGE:$TAG"
          docker image inspect -f "$WEB_IMAGE {{index .RepoDigests 0}}" "$WEB_IMAGE:$TAG"
