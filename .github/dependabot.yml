# Paired with devforge-be's. Same reasoning, and the same monthly cadence: a
# dependency pull request nobody has time to read trains people to close them
# unread, which is the habit that lets a CVE sit.
version: 2
updates:
  # The base image in Dockerfile. It went stale once already — caddy:2-alpine
  # was carrying 17 HIGH CVEs and was the newest Caddy there was — and nothing
  # in the repository had the job of noticing.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # The Vite toolchain moves as a unit and its transitive advisories
      # (nanoid, postcss) come in through it. One pull request, not six.
      build-tooling:
        patterns: ["vite", "@vitejs/*", "rolldown*", "oxlint", "typescript"]

  # `aquasecurity/trivy-action@0.28.0` was pinned to a tag that never existed,
  # so the scanner silently never ran on any branch. A bot that resolves action
  # references would have said so on day one.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
